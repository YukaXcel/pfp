<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.6);
        }

        .glass-box {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        @keyframes neon-glow {

            0%,
            100% {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #a855f7, 0 0 40px #a855f7;
            }

            50% {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #a855f7, 0 0 20px #a855f7;
            }
        }

        .neon-text {
            animation: neon-glow 2s ease-in-out infinite;
        }

        .profile-img {
            border: 3px solid #a855f7;
            box-shadow: 0 0 20px #a855f7;
        }

        .click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.8));
            transition: all 0.3s ease;
        }
    </style>
</head>

<body class="h-screen w-screen flex items-center justify-center text-white bg-black overflow-hidden">
    <!-- Background Video -->
    <video autoplay loop muted playsinline>
        <source src="assets/videos/rewrite_overme.mp4" type="video/mp4">
    </video>

    <!-- Background Audio -->
    <audio id="bg-audio" loop>
        <source src="assets/audios/rewrite_overme.m4a" type="audio/mp4">
    </audio>

    <!-- Click to Start Overlay -->
    <div id="click-overlay" class="click-overlay cursor-pointer">
        <div
            class="text-center bg-gradient-to-r from-purple-600 to-pink-600 p-8 rounded-2xl hover:scale-105 transition-transform">
            <h1 class="text-3xl font-bold mb-2">Click to Enter</h1>
            <p class="text-sm opacity-80">音楽が流れます</p>
        </div>
    </div>

    <!-- Main profile box -->
    <div class="glass-box rounded-3xl p-8 max-w-md w-full mx-4 space-y-6 text-center">
        <!-- Profile Image -->
        <div class="flex justify-center">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzY5Ngzt37qnK_VtTBcyznqYnu3q3Ub7go2Q&s"
                alt="profile" class="profile-img w-32 h-32 rounded-full object-cover">
        </div>

        <!-- Username -->
        <h1 class="neon-text text-4xl font-bold">hi</h1>

        <!-- Bio/Quote -->

        <p class="text-gray-300 text-lg italic leading-relaxed">
            Welcome to my profile ✨
        </p>

        <!-- Divider -->
        <div class="border-t border-gray-600 my-4"></div>

        <!-- Social Links (NOW INSIDE THE BOX) -->
        <div class="flex justify-center gap-6 pt-2">
            <a href="https://github.com/YukaXcel" class="social-icon" title="github">
                        <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
            </svg>
            </a>
            <a href="https://www.youtube.com/@igusuri_please" class="social-icon" title="YouTube">
                <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z" />
                </svg>
            </a>
        </div>

    </div>

    <!-- Audio Control (Bottom Right) -->
    <button id="audio-control" onclick="toggleAudio()"
        class="fixed bottom-6 right-6 glass-box px-4 py-3 rounded-full text-white hover:bg-purple-500/20 transition z-50">
        <span id="audio-icon">🔊</span>
    </button>

    <script>
        const audio = document.getElementById('bg-audio');
        const overlay = document.getElementById('click-overlay');
        let audioPlaying = false;

        // Set volume
        audio.volume = 0.3;

        function startAudio() {
            audio.play().then(() => {
                overlay.style.display = 'none';
                audioPlaying = true;
            }).catch(error => {
                console.log("Autoplay blocked:", error);
            });
            document.removeEventListener('click', startAudio);
        }

        function toggleAudio() {
            const icon = document.getElementById('audio-icon');
            if (audioPlaying) {
                audio.pause();
                icon.textContent = '🔇';
                audioPlaying = false;
            } else {
                audio.play();
                icon.textContent = '🔊';
                audioPlaying = true;
            }
        }

        document.addEventListener('click', startAudio);
    </script>
</body>

</html>
