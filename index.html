<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>
<!-- Background video -->
<video autoplay loop muted
>
<source src="assets/videos/wasure_mono.mp4" type="video/mp4">

</video>
<!-- Background audio -->
 <audio id="bg-audio" loop>
    <source src="assets/audios/wasure_mono.m4a" type="audio/mpeg">
 </audio>
  <div id="click-overlay"
        class="z-10 cursor-pointer text-center bg-black/50 p-4 rounded-lg backdrop-blur-sm hover:bg-black/70 transition">
        <h1 class="text-2xl font-bold">Click anywhere to start</h1>
    </div>
 <script>
        // ดึง Element Audio และ Overlay
        const audio = document.getElementById('bg-audio');
        const overlay = document.getElementById('click-overlay');
    audio.volume =0.05;
        // สร้างฟังก์ชันเล่นเสียง
        function startAudio() {
            audio.play().then(() => {
                // ถ้าเล่นสำเร็จ ให้ซ่อนข้อความ
                overlay.style.display = 'none';
            }).catch(error => {
                console.log("Autoplay blocked:", error);
            });

            // ลบ Event Listener ออก เพื่อไม่ให้กดซ้ำแล้วเสียงเริ่มใหม่
            document.removeEventListener('click', startAudio);
        }
        // ดักจับการคลิกบนหน้าเว็บ
        document.addEventListener('click', startAudio);
    </script>
</body>    
</html>
